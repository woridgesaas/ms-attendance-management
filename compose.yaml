services:

  woridge.db.attendance:
    image: postgres:16
    container_name: "attendance_management_db"
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - database_data_prod:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - woridge-external-network
      - provisioning-service-network

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: "ms-attendance-management"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${POSTGRES_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${SERVER_PORT}:8080"
    restart: always
    depends_on:
      woridge.db.attendance:
        condition: service_healthy
    networks:
      - woridge-external-network

volumes:
  database_data_prod:

networks:
  woridge-external-network:
    external: true

  provisioning-service-network:
    external: true
