spring:
  application:
    name: ms-attendance-management
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    validate-on-migrate: true
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
rabbitmq:
  exchange: woridge.exchange
  routing-keys:
    absence-alert-rh:  notification.absence.alert.rh
    absence-alert-ceo: notification.absence.alert.ceo
    holiday-created: holiday.created
    overtime-processed-alert: overtime.processed.alert
  holiday-queue: holiday.queue
server:
  port: 8082
  address: 0.0.0.0
  servlet:
    context-path: /api/attendance

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: leave-justifications

#future:ms-parametrage
attendance:
  business:
    justification-deadline-days: 3
    rh-alert-threshold: 2
    ceo-alert-threshold: 3

    daily-max-hours: 9
    weekly-max-hours: 40
    monthly-max-hours: 98